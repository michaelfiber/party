<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b2ff7" />
  <meta name="robots" content="noindex" />
  <title>Print QR cards · Party Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=15" />
</head>
<body class="print-page">
  <div id="print-controls">
    <p class="eyebrow"><a class="back-home" href="./">← Back to your party</a></p>
    <h1>Print QR cards</h1>
    <p class="lede">Print this sheet, cut along the dashed lines, and put a card on every table.</p>
    <p id="print-warn" class="banner-error" hidden></p>
    <div class="print-row">
      <div class="seg" role="group" aria-label="Cards per page">
        <button type="button" data-per="4">4 per page</button>
        <button type="button" data-per="6" aria-pressed="true">6 per page</button>
        <button type="button" data-per="9">9 per page</button>
      </div>
      <button id="print-btn" type="button" disabled>🖨 Print</button>
    </div>
  </div>

  <div id="sheet-wrap">
    <div id="sheet" class="per-6" aria-label="Sheet of QR cards"></div>
  </div>

  <template id="card-tpl">
    <div class="qr-card">
      <p class="qr-card-party"></p>
      <p class="qr-card-head">Scan me!</p>
      <img class="qr-card-code" alt="QR code to open the party camera" />
      <p class="qr-card-blurb">Scan this, take pics, and they go straight to the host's cloud.</p>
      <p class="qr-card-foot">No app needed · Party Cam</p>
    </div>
  </template>

  <script src="print.js?v=1"></script>
  <script src="banner.js?v=1"></script>
</body>
</html>
