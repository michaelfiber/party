name: Build ARM64 binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[Auto deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile Linux ARM64
        run: make pi

      - name: Commit binary if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/party-linux-arm64 dist/getfile-linux-arm64
          if git diff --staged --quiet; then
            echo "ARM64 binary unchanged"
            exit 0
          fi
          git commit -m "Rebuild dist/party-linux-arm64 [Auto deploy]"
          git push
